<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Start Page</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>PAGINA DE INICIO</h1>
    <p th:text="${mensaje}"></p>
    <p th:text="${dato}"></p>

    <hr>
    <h4>LISTA DE PERSONAS</h4>
    <hr>
    
    <div th:if="${usuarios != null and !usuarios.empty}">
        <table border="2">
            <tr>
                <th>CEDULA</th>
                <th>CLAVE</th>
                <th>NOMBRE</th>
                <th>EMAIL</th>
            </tr>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.cedula}"></td>
                <td th:text="${u.clave}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.email}"></td>
            </tr>
        </table>
    </div>
    
    <div th:if="${usuarios == null or usuarios.empty}">
        La lista de usuarios está vacía.
    </div>

</body>
</html>
