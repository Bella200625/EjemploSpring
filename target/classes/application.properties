spring.application.name=EjemploSpring
server.port=9090
spring.thymeleaf.cache=false
index.mensaje=Dato ubicado en aplication.properties

# BD confi
spring.datasource.url=jdbc:mysql://localhost/mi_base_de_datos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DIALECTO DE MYSQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MOSTRAR EL LOG DEL SQL EN LA CONSOLA
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE