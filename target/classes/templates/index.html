<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
    <title>PAGINA DE INICIO</title>
    <meta charset="UTF-8">
</head>
<body>
   
<header th:replace="plantillas/partes :: cabecero"></header>


<h3>PAGINA DE INICIO</h3>

    <a 
    th:href="@{/agregar}" th:text="#{usuario.crear}">mensaje pa agregar
    </a>
    
    <hr>
    
    <h4 th:text="#{usuario.lista}">mensaje de lista de personas</h4>

    <div th:if="${usuarios != null and !usuarios.empty}">
        <table border="1">
            <tr>
                <th><span th:text="#{usuario.cedula}"></span></th>
                <th><span th:text="#{usuario.clave}"></span></th>
                <th><span th:text="#{usuario.nombre}"></span></th>
                <th><span th:text="#{usuario.email}"></span></th>
                <th><span th:text="#{accion.editar}"></span></th>
                <th><span th:text="#{accion.eliminar}"></span></th>
                <th th:text="#{gasto.registrar}"></th>
            </tr>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.cedula}"></td>
                <td th:text="${u.clave}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.email}"></td>
                <td><a th:href="@{/editar/} + ${u.cedula}" th:text="#{accion.editar}"></a></td>
                <td><a th:href="@{/eliminar(cedula=${u.cedula})}" th:text="#{accion.eliminar}"></a></td>
                <td><a th:href="@{/gastos/listar/} + ${u.cedula}" th:text="#{accion.verGastos}"></a></td>            
            </tr>
        </table>
    </div>
    
    <div th:if="${usuarios == null or usuarios.empty}">
        La lista de usuarios está vacía.
    </div>

    <br/>
    <hr>
    

    <footer th:replace="plantillas/partes :: pie"></footer>

</body>
</html>
