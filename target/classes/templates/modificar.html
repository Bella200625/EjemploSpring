<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>DATOS DEL USUARIO</title>
    <meta charset="UTF-8">
</head>

<header th:replace="plantillas/partes :: cabecero"></header>
    <hr>


<body>
    <h2>Datos del Usuario</h2>
    <a th:href="@{/}" th:text="#{accion.regresar}">REGRESAR</a>
    <br/>
    
    <form th:action="@{/guardar}" method="POST" th:object="${usuario}">
        <br/>
        <label for="cedula" th:text="#{f.cedula}"></label>
        <input type="text" name="cedula" th:field="*{cedula}" required />
        <span th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}" style="color:rgb(143, 7, 7);">Error Cedula</span>
        <br/>

        <label for="clave" th:text="#{f.clave}"></label>
        <input type="password" name="clave" th:field="*{clave}" />
        <span th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}" style="color:rgb(143, 7, 7);">Error Clave</span>
        <br/>

        <label for="nombre" th:text="#{f.nombre}"></label>
        <input type="text" name="nombre" th:field="*{nombre}" />
        <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color:rgb(143, 7, 7);">Error Nombre</span>
        <br/>

        <label for="email" th:text="#{f.email}"></label>
        <input type="email" name="email" th:field="*{email}" />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:rgb(143, 7, 7);">Error Email</span>
        <br/><br/>
        
        <input type="reset" th:value="#{accion.reiniciar}"/> &nbsp; &nbsp; &nbsp;
        <input type="submit" name="guardar" th:value="#{accion.guardar}"/>
    </form>

    <hr>

    <footer th:replace="plantillas/partes :: pie"></footer>

</body>
</html>
